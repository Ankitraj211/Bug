name: Build and Notify

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build
        run: echo "Build successful"

      - name: Call Webhook
        run: |
          curl -X POST "https://defaulta0783b62a4384df4b01a1922ce21ddb.e.environment.api.preprod.powerplatform.com:443/powerautomate/automations/direct/workflows/18656b24b6144cf7a10a2958d920282c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=242BP-8Ode_KZRh5QO2h3J7ufyebyNc4PwAcDbTgbvs" \
          -H "Content-Type: application/json" \
          -d '{
            "text": "Build Successful 🚀",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "GitHub Action Build Completed",
                      "weight": "Bolder",
                      "size": "Medium"
                    }
                  ]
                }
              }
            ]
          }'
